<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión - Guía Cali</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }
      
      .container {
        max-width: 400px;
      }
      
      .icon {
        font-size: 80px;
        margin-bottom: 20px;
        opacity: 0.9;
      }
      
      h1 {
        font-size: 28px;
        margin-bottom: 16px;
        font-weight: 600;
      }
      
      p {
        font-size: 16px;
        line-height: 1.6;
        opacity: 0.9;
        margin-bottom: 24px;
      }
      
      button {
        background: white;
        color: #667eea;
        border: none;
        padding: 12px 32px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        font-family: inherit;
      }
      
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      }
      
      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">📡</div>
      <h1>Sin conexión a Internet</h1>
      <p>
        No podemos conectarnos ahora mismo. Por favor, verifica tu conexión
        e intenta nuevamente.
      </p>
      <button onclick="window.location.reload()">
        Intentar de nuevo
      </button>
    </div>
  </body>
</html>
